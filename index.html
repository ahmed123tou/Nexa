<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Nexa — Chat & Hangout</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#070707;color:#eee;font-family:Inter,Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.auth{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 50% 0,#1a1130,#070707 48%)}.card{width:min(430px,100%);background:#101010;border:1px solid #292929;border-radius:24px;padding:32px;box-shadow:0 25px 80px #000}.logo{display:flex;align-items:center;gap:10px;font-size:27px;font-weight:800}.mark{width:40px;height:40px;border-radius:13px;background:linear-gradient(135deg,#7957ff,#4d2bd6);display:grid;place-items:center}.sub{color:#888;margin:9px 0 25px}.field{margin:14px 0}.field label{display:block;font-size:12px;color:#aaa;margin-bottom:7px}.field input,.field select{width:100%;padding:13px;border-radius:11px;background:#080808;border:1px solid #292929;color:#fff;outline:0}.field input:focus,.field select:focus{border-color:#7655ff}.primary,.secondary{width:100%;padding:13px;border-radius:11px;font-weight:700}.primary{background:#7050f5;color:#fff;border:0}.secondary{background:#191919;border:1px solid #2b2b2b;color:#ddd}.link{border:0;background:none;color:#9b86ff}.center{text-align:center}.small{font-size:12px;color:#888;line-height:1.5}.msg{padding:10px;border-radius:10px;margin:10px 0;background:#271217;color:#ff8a94;border:1px solid #51232c}
.app{height:100vh;display:grid;grid-template-columns:250px 1fr 285px;overflow:hidden}.side,.right{background:#0b0b0b}.side{border-right:1px solid #252525;padding:17px}.right{border-left:1px solid #252525;padding:18px}.brand{margin-bottom:20px}.me{display:flex;gap:10px;align-items:center;padding:10px;background:#141414;border:1px solid #252525;border-radius:14px;cursor:pointer}.avatar{width:40px;height:40px;border-radius:50%;object-fit:cover;background:#222}.me b,.me span{display:block}.me span{font-size:12px;color:#777;margin-top:2px}.title{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#666;margin:20px 5px 7px}.nav{padding:10px 12px;color:#aaa;border-radius:10px;margin:3px 0}.nav:hover,.nav.active{background:#211a36;color:#fff}.friend{display:flex;align-items:center;gap:8px;padding:8px;border-radius:9px}.friend:hover{background:#151515}.friend .avatar{width:31px;height:31px}.main{min-width:0;display:flex;flex-direction:column}.top{height:67px;border-bottom:1px solid #252525;display:flex;align-items:center;justify-content:space-between;padding:0 22px}.top h2{font-size:16px}.add{background:#181818;color:#fff;border:1px solid #292929;border-radius:10px;padding:9px 13px}.content{overflow:auto;padding:30px}.hero{max-width:800px;margin:8vh auto;text-align:center}.hero h1{font-size:46px;letter-spacing:-2px;margin:0 0 10px}.hero p{color:#888;font-size:16px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:30px}.feature{background:#101010;border:1px solid #242424;border-radius:16px;padding:20px;text-align:left}.feature b{display:block;margin-bottom:6px}.feature span{color:#777;line-height:1.5}.profile{position:fixed;right:18px;bottom:18px;width:320px;background:#111;border:1px solid #2b2b2b;border-radius:18px;padding:17px;box-shadow:0 20px 70px #000;z-index:5}.profileHead{display:flex;gap:11px;align-items:center}.profileHead .avatar{width:54px;height:54px}.settingsPage{position:fixed;inset:0;background:#090909;z-index:20;display:grid;grid-template-columns:235px 1fr}.settingsSide{background:#0d0d0d;border-right:1px solid #252525;padding:22px}.settingsSide button{width:100%;background:transparent;border:0;color:#888;text-align:left;padding:11px;border-radius:9px;margin:2px 0}.settingsSide button.active,.settingsSide button:hover{background:#211a36;color:#fff}.settingsMain{overflow:auto;padding:34px;max-width:900px}.settingSection{background:#111;border:1px solid #252525;border-radius:16px;padding:20px;margin-bottom:14px}.settingSection h3{margin-top:0}.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}.danger{background:#2b1215;color:#ff8790;border:1px solid #542329}.modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:20px;z-index:30}.box{width:min(600px,100%);max-height:90vh;overflow:auto;background:#111;border:1px solid #2b2b2b;border-radius:20px;padding:22px}.modalTop{display:flex;justify-content:space-between;align-items:center}.close{background:#1b1b1b;color:#aaa;border:0;border-radius:9px;width:34px;height:34px}.tabs{display:flex;gap:6px;overflow:auto;margin:18px 0}.tab{background:#181818;border:0;color:#888;padding:9px 12px;border-radius:9px;white-space:nowrap}.tab.active{background:#29213e;color:#fff}.request,.result{display:flex;align-items:center;gap:10px;background:#171717;border-radius:12px;padding:11px;margin:7px 0}.actions{margin-left:auto;display:flex;gap:5px}.actions button,.result button{background:#292929;color:#fff;border:0;border-radius:8px;padding:7px 9px}.actions .yes,.result button{background:#6e4df0}.search{display:flex;gap:8px}.search input{flex:1;padding:12px;background:#080808;border:1px solid #292929;color:#fff;border-radius:10px}.search button{border:0;border-radius:10px;background:#7050f5;color:#fff;padding:0 15px}
.exploreCard{background:#111;border:1px solid #252525;border-radius:16px;padding:22px;margin-bottom:12px}.exploreCard h3{margin:0 0 7px}.tag{display:inline-block;padding:6px 9px;background:#211a36;color:#a995ff;border-radius:8px;font-size:12px;margin:3px}
.preview{width:110px;height:110px;border-radius:50%;object-fit:cover;background:#222;border:2px solid #2b2b2b}.uploadBox{display:flex;gap:20px;align-items:center;flex-wrap:wrap}.file{background:#191919;border:1px solid #2b2b2b;padding:10px;border-radius:10px}
@media(max-width:900px){.app{grid-template-columns:205px 1fr}.right{display:none}}@media(max-width:650px){.app{grid-template-columns:1fr}.side{display:none}.hero h1{font-size:34px}.grid{grid-template-columns:1fr}.content{padding:18px}.settingsPage{grid-template-columns:175px 1fr}.settingsMain{padding:18px}}
</style>
</head>
<body>
<div id="auth" class="auth"><div class="card">
<div class="logo"><div class="mark">N</div>Nexa</div><div class="sub">Chat, talk and hang out with your friends.</div><div id="message"></div>
<div id="login"><div class="field"><label>Username</label><input id="liUser" placeholder="your username"></div><div class="field"><label>Password</label><input id="liPass" type="password" placeholder="••••••••"></div><button class="primary" onclick="login()">Log in</button><p class="center small" style="margin-top:20px">Don't have an account? <button class="link" onclick="signupView()">Sign up</button></p></div>
<div id="signup" class="hidden"><h3>Create your Nexa account</h3><div class="field"><label>Display name</label><input id="suDisplay" placeholder="Cool Name"></div><div class="field"><label>Username</label><input id="suUser" placeholder="coolusername"></div><div class="field"><label>Password</label><input id="suPass" type="password" placeholder="At least 6 characters"></div><button class="primary" onclick="signup()">Create account</button><p class="center small" style="margin-top:18px">Already have an account? <button class="link" onclick="loginView()">Log in</button></p></div>
</div></div>

<div id="app" class="app hidden">
<aside class="side"><div class="brand logo"><div class="mark">N</div>Nexa</div>
<div class="me" onclick="toggleProfile()"><img id="sideAvatar" class="avatar"><div><b id="sideDisplay"></b><span id="sideUser"></span></div></div>
<div class="title">Navigation</div><div id="homeNav" class="nav active" onclick="showHome()">⌂ Home</div><div id="exploreNav" class="nav" onclick="showExplore()">✦ Explore</div>
<div class="title">Friends</div><div id="leftFriends"><span class="small">No friends yet.</span></div></aside>
<main class="main"><header class="top"><h2 id="pageTitle">Home</h2><button class="add" onclick="friendsModal()">＋ Add friends</button></header><div id="pageContent" class="content"></div></main>
<aside class="right"><b>Your friends</b><div id="rightFriends" class="small" style="margin-top:15px">Add people to start your friend list.</div></aside></div>

<div id="profile" class="profile hidden"><div class="profileHead"><img id="panelAvatar" class="avatar"><div><b id="panelDisplay"></b><div id="panelUser" class="small"></div></div></div><div style="height:12px"></div><button class="secondary" onclick="openSettings()">Manage account</button><button class="secondary" style="margin-top:8px" onclick="logout()">Log out</button></div>

<div id="settingsPage" class="settingsPage hidden">
<aside class="settingsSide"><div class="logo" style="font-size:21px;margin-bottom:20px"><div class="mark" style="width:34px;height:34px">N</div>Settings</div>
<button class="active" onclick="settingPage('account',this)">Account</button><button onclick="settingPage('profile',this)">Profile</button><button onclick="settingPage('appearance',this)">Appearance</button><button onclick="settingPage('privacy',this)">Privacy</button><button onclick="settingPage('security',this)">Security</button><button onclick="settingPage('notifications',this)">Notifications</button><button onclick="closeSettings()" style="margin-top:25px">← Back to Nexa</button></aside>
<main class="settingsMain"><div class="modalTop"><h1 style="margin-top:0">Settings</h1></div><div id="settingsContent"></div></main></div>

<div id="friends" class="modal hidden"><div class="box"><div class="modalTop"><h3>Friends</h3><button class="close" onclick="closeModal('friends')">×</button></div><div class="tabs"><button class="tab active" onclick="friendTab('all',this)">All</button><button class="tab" onclick="friendTab('online',this)">Online</button><button class="tab" onclick="friendTab('offline',this)">Offline</button><button class="tab" onclick="friendTab('pending',this)">Pending</button><button class="tab" onclick="friendTab('add',this)">Add a friend</button></div><div id="friendsContent"></div></div></div>

<script>
const KEY="nexa_v2_data",SESSION="nexa_v2_session";let me=null;
function $(id){return document.getElementById(id)}function db(){return JSON.parse(localStorage.getItem(KEY)||'{"users":[],"friendships":[]}')}function save(d){localStorage.setItem(KEY,JSON.stringify(d))}
function pass(p){let h=2166136261;for(let i=0;i<p.length;i++){h^=p.charCodeAt(i);h=Math.imul(h,16777619)}return(h>>>0).toString(16)}
function avatar(u){return u.avatar_url||"https://api.dicebear.com/9.x/fun-emoji/svg?seed="+encodeURIComponent(u.username)}
function esc(x){return String(x||"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll('"',"&quot;")}
function say(t){$("message").innerHTML='<div class="msg">'+t+'</div>'}
function loginView(){$("login").classList.remove("hidden");$("signup").classList.add("hidden");$("message").innerHTML=""}function signupView(){$("signup").classList.remove("hidden");$("login").classList.add("hidden");$("message").innerHTML=""}
function signup(){let d=db(),display=$("suDisplay").value.trim(),username=$("suUser").value.trim().toLowerCase(),password=$("suPass").value;if(!display||!/^[a-z0-9_]{3,24}$/.test(username)||password.length<6)return say("Enter a display name, a valid username and a password with at least 6 characters.");if(d.users.some(u=>u.username===username))return say("That username is already taken.");let u={id:crypto.randomUUID(),display_name:display,username,password:pass(password),avatar_url:"",created:Date.now()};d.users.push(u);save(d);localStorage.setItem(SESSION,u.id);enter(u)}
function login(){let d=db(),u=d.users.find(x=>x.username===$("liUser").value.trim().toLowerCase()&&x.password===pass($("liPass").value));if(!u)return say("Wrong username or password.");localStorage.setItem(SESSION,u.id);enter(u)}
function enter(u){me=u;$("auth").classList.add("hidden");$("app").classList.remove("hidden");render();loadFriends();showHome()}
function render(){$("sideAvatar").src=avatar(me);$("panelAvatar").src=avatar(me);$("sideDisplay").textContent=me.display_name;$("panelDisplay").textContent=me.display_name;$("sideUser").textContent="@"+me.username;$("panelUser").textContent="@"+me.username}
function logout(){localStorage.removeItem(SESSION);location.reload()}function toggleProfile(){$("profile").classList.toggle("hidden")}
function openSettings(){$("profile").classList.add("hidden");$("settingsPage").classList.remove("hidden");settingPage("account")}
function closeSettings(){$("settingsPage").classList.add("hidden");showHome()}
function settingPage(tab,b){document.querySelectorAll(".settingsSide button").forEach(x=>x.classList.remove("active"));if(b)b.classList.add("active");let c=$("settingsContent");
if(tab==="account")c.innerHTML='<div class="settingSection"><h3>Account information</h3><p class="small">Your Nexa account uses a username and password. No email is required.</p><div class="field"><label>Username</label><input id="setUser" value="'+esc(me.username)+'"></div><button class="primary" onclick="saveAccount()">Save username</button></div><div class="settingSection"><h3>Change password</h3><div class="field"><label>Current password</label><input id="oldP" type="password"></div><div class="field"><label>New password</label><input id="newP" type="password"></div><div class="field"><label>Confirm new password</label><input id="newP2" type="password"></div><button class="primary" onclick="changePassword()">Change password</button></div><div class="settingSection"><h3>Danger zone</h3><p class="small">Delete this local Nexa account and its friend requests.</p><button class="primary danger" onclick="deleteAccount()">Delete account</button></div>';
if(tab==="profile")c.innerHTML='<div class="settingSection"><h3>Profile</h3><div class="uploadBox"><img id="profilePreview" class="preview" src="'+esc(avatar(me))+'"><div><label class="file">Upload image/GIF <input id="avatarFile" type="file" accept="image/*" hidden onchange="filePreview(event)"></label><p class="small">PNG, JPG, WEBP or animated GIF. The file is stored in this browser.</p></div></div><div class="field"><label>Image or GIF URL</label><input id="avatarUrl" value="'+esc(me.avatar_url||"")+'" placeholder="https://example.com/image.gif"></div><div class="field"><label>Display name</label><input id="setDisplay" value="'+esc(me.display_name)+'"></div><button class="primary" onclick="saveProfile()">Save profile</button><p class="small">If you upload a file, it takes priority over the URL.</p></div>';
if(tab==="appearance")c.innerHTML='<div class="settingSection"><h3>Appearance</h3><p class="small">Choose how Nexa feels.</p><div class="field"><label>Accent</label><select id="accent"><option>Purple</option><option>Blue</option><option>Green</option></select></div><button class="primary" onclick="alert("Appearance saved!")">Save appearance</button></div><div class="settingSection"><h3>Compact mode</h3><p class="small">Keep the interface spacious and easy to use.</p><button class="secondary" onclick="alert("Compact mode coming soon.")">Toggle compact mode</button></div>';
if(tab==="privacy")c.innerHTML='<div class="settingSection"><h3>Privacy</h3><p class="small">Control what other people can find.</p><div class="field"><label>Who can send you friend requests?</label><select><option>Everyone</option><option>Friends of friends</option><option>Nobody</option></select></div><button class="primary" onclick="alert("Privacy settings saved!")">Save privacy</button></div>';
if(tab==="security")c.innerHTML='<div class="settingSection"><h3>Security</h3><p class="small">Your password is stored as a one-way hash in this demo. Never reuse an important real password here.</p><button class="secondary" onclick="alert("You are currently logged in as @'+esc(me.username)+'")">View session info</button></div>';
if(tab==="notifications")c.innerHTML='<div class="settingSection"><h3>Notifications</h3><p class="small">Choose which Nexa notifications you want.</p><div class="field"><label><input type="checkbox" checked> Friend requests</label></div><div class="field"><label><input type="checkbox" checked> Messages</label></div><div class="field"><label><input type="checkbox" checked> Mentions</label></div><button class="primary" onclick="alert("Notification settings saved!")">Save notifications</button>'}
function saveAccount(){let d=db(),u=d.users.find(x=>x.id===me.id),n=$("setUser").value.trim().toLowerCase();if(!/^[a-z0-9_]{3,24}$/.test(n))return alert("Invalid username.");if(d.users.some(x=>x.username===n&&x.id!==me.id))return alert("Username is already taken.");u.username=n;save(d);me=u;render();alert("Username updated.")}
function saveProfile(){let d=db(),u=d.users.find(x=>x.id===me.id),display=$("setDisplay").value.trim(),url=$("avatarUrl").value.trim();if(!display)return alert("Display name cannot be empty.");u.display_name=display;if(url)u.avatar_url=url;save(d);me=u;render();alert("Profile updated.")}
function filePreview(e){let f=e.target.files[0];if(!f)return;if(f.size>4*1024*1024)return alert("Please use an image/GIF under 4 MB.");let r=new FileReader();r.onload=()=>{me.avatar_url=r.result;$("profilePreview").src=r.result};r.readAsDataURL(f)}
function changePassword(){let d=db(),u=d.users.find(x=>x.id===me.id),a=$("oldP").value,b=$("newP").value,c=$("newP2").value;if(u.password!==pass(a))return alert("Current password is incorrect.");if(b.length<6||b!==c)return alert("New passwords must match and be at least 6 characters.");u.password=pass(b);save(d);alert("Password changed.")}
function deleteAccount(){if(!confirm("Delete your Nexa account?"))return;let d=db();d.users=d.users.filter(x=>x.id!==me.id);d.friendships=d.friendships.filter(x=>x.user_id!==me.id&&x.friend_id!==me.id);save(d);logout()}
function showHome(){$("pageTitle").textContent="Home";$("homeNav").classList.add("active");$("exploreNav").classList.remove("active");$("pageContent").innerHTML='<div class="hero"><h1>Welcome to Nexa.</h1><p>Chat, talk and hang out. Your little corner of the internet.</p><div class="grid"><div class="feature"><b>💬 Chat</b><span>Connect with friends and start conversations.</span></div><div class="feature"><b>🎧 Talk</b><span>Hang out together and keep your community close.</span></div><div class="feature"><b>✨ Your profile</b><span>Customize your name, username and avatar.</span></div></div></div>'}
function showExplore(){$("pageTitle").textContent="Explore";$("homeNav").classList.remove("active");$("exploreNav").classList.add("active");$("pageContent").innerHTML='<div style="max-width:850px;margin:auto"><h1>Explore Nexa</h1><p class="small">Find people and discover places to hang out.</p><div class="exploreCard"><h3>👥 Find people</h3><p class="small">Search Nexa by username or display name and send a friend request.</p><button class="primary" style="width:auto" onclick="friendsModal();friendTab("add")">Find friends</button></div><div class="exploreCard"><h3>🌟 Nexa communities</h3><p class="small">Communities and public hangout spaces will appear here as Nexa grows.</p><span class="tag">Gaming</span><span class="tag">Music</span><span class="tag">Art</span><span class="tag">Chill</span></div><div class="exploreCard"><h3>🔎 Quick search</h3><div class="search"><input id="quickSearch" placeholder="Search a username or display name"><button onclick="quickPeople()">Search</button></div><div id="quickResults"></div></div></div>'}
function quickPeople(){let q=$("quickSearch").value.trim().toLowerCase(),d=db(),a=d.users.filter(u=>u.id!==me.id&&(u.username.includes(q)||u.display_name.toLowerCase().includes(q))).slice(0,10);$("quickResults").innerHTML=a.map(u=>'<div class="result"><img class="avatar" src="'+esc(avatar(u))+'"><div><b>'+esc(u.display_name)+'</b><div class="small">@'+esc(u.username)+'</div></div><button onclick="sendFriend(\''+u.id+'\')">Add</button></div>').join("")||'<p class="small">No users found.</p>'}
function friendsModal(){$("friends").classList.remove("hidden");friendTab("all")}
function closeModal(id){$(id).classList.add("hidden")}
function friendTab(tab,b){document.querySelectorAll("#friends .tab").forEach(x=>x.classList.remove("active"));if(b)b.classList.add("active");let box=$("friendsContent"),d=db();if(tab==="add"){box.innerHTML='<p class="small">Search by username or display name.</p><div class="search"><input id="fq" placeholder="username or display name"><button onclick="searchPeople()">Search</button></div><div id="results"></div>';return}if(tab==="pending"){let rows=d.friendships.filter(r=>r.status==="pending"&&(r.user_id===me.id||r.friend_id===me.id));if(!rows.length){box.innerHTML='<p class="small">No pending requests.</p>';return}box.innerHTML=rows.map(r=>{let p=d.users.find(x=>x.id===(r.user_id===me.id?r.friend_id:r.user_id));let incoming=r.friend_id===me.id;return '<div class="request"><img class="avatar" src="'+esc(avatar(p))+'"><div><b>'+esc(p.display_name)+'</b><div class="small">@'+esc(p.username)+' · '+(incoming?'sent you a request':'request sent')+'</div></div>'+(incoming?'<div class="actions"><button class="yes" onclick="respond(\''+r.id+'\',true)">Accept</button><button onclick="respond(\''+r.id+'\',false)">Decline</button></div>':'')+'</div>'}).join("");return}let fs=getFriends(),list=tab==="all"?fs:fs.filter(x=>tab==="online"?x.online:!x.online);box.innerHTML=list.length?list.map(friendHTML).join(""):'<p class="small">No friends here yet.</p>'}
function getFriends(){let d=db(),ids=d.friendships.filter(r=>r.status==="accepted"&&(r.user_id===me.id||r.friend_id===me.id)).map(r=>r.user_id===me.id?r.friend_id:r.user_id);return ids.map(id=>d.users.find(u=>u.id===id)).filter(Boolean).map(u=>({...u,online:false}))}
function friendHTML(f){return '<div class="friend"><img class="avatar" src="'+esc(avatar(f))+'"><div><b>'+esc(f.display_name)+'</b><div class="small">@'+esc(f.username)+'</div></div></div>'}
function searchPeople(){let q=$("fq").value.trim().toLowerCase(),d=db(),arr=d.users.filter(u=>u.id!==me.id&&(u.username.includes(q)||u.display_name.toLowerCase().includes(q))).slice(0,10);$("results").innerHTML=arr.map(u=>'<div class="result"><img class="avatar" src="'+esc(avatar(u))+'"><div><b>'+esc(u.display_name)+'</b><div class="small">@'+esc(u.username)+'</div></div><button onclick="sendFriend(\''+u.id+'\')">Add</button></div>').join("")||'<p class="small">No users found.</p>'}
function sendFriend(id){let d=db();if(d.friendships.some(r=>(r.user_id===me.id&&r.friend_id===id)||(r.user_id===id&&r.friend_id===me.id)))return alert("A friendship or request already exists.");d.friendships.push({id:crypto.randomUUID(),user_id:me.id,friend_id:id,status:"pending"});save(d);alert("Friend request sent!")}
function respond(id,yes){let d=db(),r=d.friendships.find(x=>x.id===id);if(r)r.status=yes?"accepted":"declined";save(d);friendTab("pending");loadFriends()}
function loadFriends(){let fs=getFriends();$("leftFriends").innerHTML=fs.length?fs.map(friendHTML).join(""):'<span class="small">No friends yet.</span>';$("rightFriends").innerHTML=fs.length?fs.map(f=>'<div class="friend"><img class="avatar" src="'+esc(avatar(f))+'"><span>'+esc(f.display_name)+'</span></div>').join(""):"Add people to start your friend list."}
(function(){let id=localStorage.getItem(SESSION);if(id){let u=db().users.find(x=>x.id===id);if(u)enter(u)}})();
</script>
</body>
</html>
