<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Nexa — Chat & Hangout thats it</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#070707;color:#eee;font-family:Inter,Arial,sans-serif}
button,input,select{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

.auth{
min-height:100vh;display:grid;place-items:center;padding:20px;
background:radial-gradient(circle at 50% 0,#1a1130,#070707 48%)
}
.card{
width:min(430px,100%);background:#101010;border:1px solid #292929;
border-radius:24px;padding:32px;box-shadow:0 25px 80px #000
}
.logo{display:flex;align-items:center;gap:10px;font-size:27px;font-weight:800}
.mark{
width:40px;height:40px;border-radius:13px;
background:linear-gradient(135deg,#7957ff,#4d2bd6);
display:grid;place-items:center
}
.sub{color:#888;margin:9px 0 25px}
.field{margin:14px 0}
.field label{display:block;font-size:12px;color:#aaa;margin-bottom:7px}
.field input,.field select{
width:100%;padding:13px;border-radius:11px;background:#080808;
border:1px solid #292929;color:#fff;outline:0
}
.field input:focus,.field select:focus{border-color:#7655ff}
.primary,.secondary{
width:100%;padding:13px;border-radius:11px;font-weight:700
}
.primary{background:#7050f5;color:#fff;border:0}
.secondary{background:#191919;border:1px solid #2b2b2b;color:#ddd}
.link{border:0;background:none;color:#9b86ff}
.center{text-align:center}
.small{font-size:12px;color:#888;line-height:1.5}
.msg{
padding:10px;border-radius:10px;margin:10px 0;
background:#271217;color:#ff8a94;border:1px solid #51232c
}

.app{
height:100vh;display:grid;grid-template-columns:250px 1fr 285px;
overflow:hidden
}
.side,.right{background:#0b0b0b}
.side{border-right:1px solid #252525;padding:17px}
.right{border-left:1px solid #252525;padding:18px}
.brand{margin-bottom:20px}

.me{
display:flex;gap:10px;align-items:center;padding:10px;
background:#141414;border:1px solid #252525;border-radius:14px;
cursor:pointer
}
.avatar{
width:40px;height:40px;border-radius:50%;
object-fit:cover;background:#222
}
.me b,.me span{display:block}
.me span{font-size:12px;color:#777;margin-top:2px}

.title{
font-size:11px;text-transform:uppercase;letter-spacing:1px;
color:#666;margin:20px 5px 7px
}
.nav{
padding:10px 12px;color:#aaa;border-radius:10px;margin:3px 0
}
.nav:hover,.nav.active{background:#211a36;color:#fff}

.friend{
display:flex;align-items:center;gap:8px;padding:8px;border-radius:9px
}
.friend:hover{background:#151515}
.friend .avatar{width:31px;height:31px}

.main{min-width:0;display:flex;flex-direction:column}
.top{
height:67px;border-bottom:1px solid #252525;
display:flex;align-items:center;justify-content:space-between;
padding:0 22px
}
.top h2{font-size:16px}
.add{
background:#181818;color:#fff;border:1px solid #292929;
border-radius:10px;padding:9px 13px
}
.content{overflow:auto;padding:30px}

.hero{max-width:800px;margin:8vh auto;text-align:center}
.hero h1{font-size:46px;letter-spacing:-2px;margin:0 0 10px}
.hero p{color:#888;font-size:16px}

.grid{
display:grid;grid-template-columns:repeat(3,1fr);
gap:12px;margin-top:30px
}
.feature{
background:#101010;border:1px solid #242424;
border-radius:16px;padding:20px;text-align:left
}
.feature b{display:block;margin-bottom:6px}
.feature span{color:#777;line-height:1.5}

.profile{
position:fixed;right:18px;bottom:18px;width:320px;
background:#111;border:1px solid #2b2b2b;border-radius:18px;
padding:17px;box-shadow:0 20px 70px #000;z-index:5

.profileHead{display:flex;gap:11px;align-items:center}
.profileHead .avatar{width:54px;height:54px}

.settingsPage{
position:fixed;inset:0;background:#090909;z-index:20;
display:grid;grid-template-columns:235px 1fr
}
.settingsSide{
background:#0d0d0d;border-right:1px solid #252525;padding:22px
}
.settingsSide button{
width:100%;background:transparent;border:0;color:#888;
text-align:left;padding:11px;border-radius:9px;margin:2px 0
}
.settingsSide button.active,.settingsSide button:hover{
background:#211a36;color:#fff
}
.settingsMain{overflow:auto;padding:34px;max-width:900px}

.settingSection{
background:#111;border:1px solid #252525;
border-radius:16px;padding:20px;margin-bottom:14px
}
.settingSection h3{margin-top:0}

.danger{
background:#2b1215;color:#ff8790;border:1px solid #542329
}

.modal{
position:fixed;inset:0;background:#000b;
display:grid;place-items:center;padding:20px;z-index:30
}
.box{
width:min(600px,100%);max-height:90vh;overflow:auto;
background:#111;border:1px solid #2b2b2b;border-radius:20px;padding:22px
}
.modalTop{
display:flex;justify-content:space-between;align-items:center
}
.close{
background:#1b1b1b;color:#aaa;border:0;
border-radius:9px;width:34px;height:34px
}
.tabs{
display:flex;gap:6px;overflow:auto;margin:18px 0
}
.tab{
background:#181818;border:0;color:#888;
padding:9px 12px;border-radius:9px;white-space:nowrap
}
.tab.active{background:#29213e;color:#fff}

.request,.result{
display:flex;align-items:center;gap:10px;
background:#171717;border-radius:12px;padding:11px;margin:7px 0
}
.actions{margin-left:auto;display:flex;gap:5px}
.actions button,.result button{
background:#292929;color:#fff;border:0;
border-radius:8px;padding:7px 9px
}
.actions .yes,.result button{background:#6e4df0}

.search{display:flex;gap:8px}
.search input{
flex:1;padding:12px;background:#080808;
border:1px solid #292929;color:#fff;border-radius:10px
}
.search button{
border:0;border-radius:10px;background:#7050f5;
color:#fff;padding:0 15px
}

.exploreCard{
background:#111;border:1px solid #252525;
border-radius:16px;padding:22px;margin-bottom:12px
}
.exploreCard h3{margin:0 0 7px}
.tag{
display:inline-block;padding:6px 9px;background:#211a36;
color:#a995ff;border-radius:8px;font-size:12px;margin:3px
}

.preview{
width:110px;height:110px;border-radius:50%;
object-fit:cover;background:#222;border:2px solid #2b2b2b
}
.uploadBox{
display:flex;gap:20px;align-items:center;flex-wrap:wrap
}
.file{
background:#191919;border:1px solid #2b2b2b;
padding:10px;border-radius:10px
}

@media(max-width:900px){
.app{grid-template-columns:205px 1fr}
.right{display:none}
}
@media(max-width:650px){
.app{grid-template-columns:1fr}
.side{display:none}
.hero h1{font-size:34px}
.grid{grid-template-columns:1fr}
.content{padding:18px}
.settingsPage{grid-template-columns:175px 1fr}
.settingsMain{padding:18px}
}
</style>

</head>

<!-- FIREBASE -->

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
getAuth,
createUserWithEmailAndPassword,
signInWithEmailAndPassword,
signOut,
onAuthStateChanged,
updatePassword
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
getFirestore,
collection,
doc,
setDoc,
getDoc,
getDocs,
updateDoc,
deleteDoc,
query,
where,
onSnapshot,
serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =========================================================
   PUT YOUR FIREBASE CONFIG HERE
   Firebase Console → Project settings → Your apps → Web app
   ========================================================= */

const firebaseConfig = {

apiKey: "PASTE_YOUR_API_KEY",
authDomain: "PASTE_YOUR_PROJECT.firebaseapp.com",
projectId: "PASTE_YOUR_PROJECT_ID",
storageBucket: "PASTE_YOUR_PROJECT.firebasestorage.app",
messagingSenderId: "PASTE_YOUR_SENDER_ID",
appId: "PASTE_YOUR_APP_ID"

};


/* ========================================================= */

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);
const db = getFirestore(app);

let me = null;
let unsubscribeUsers = null;
let unsubscribeFriendships = null;


/* ---------- HELPERS ---------- */

function $(id){
return document.getElementById(id);
}

function esc(x){
return String(x || "")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");
}

window.esc = esc;

function avatar(u){

if(u && u.avatar_url)
return u.avatar_url;

return "https://api.dicebear.com/9.x/fun-emoji/svg?seed="+
encodeURIComponent(u?.username || "nexa");

}

window.avatar = avatar;


function say(t){
$("message").innerHTML='<div class="msg">'+esc(t)+'</div>';
}


/* ---------- AUTH UI ---------- */

window.loginView=function(){

$("login").classList.remove("hidden");
$("signup").classList.add("hidden");
$("message").innerHTML="";

};

window.signupView=function(){

$("signup").classList.remove("hidden");
$("login").classList.add("hidden");
$("message").innerHTML="";

};


/* ---------- SIGN UP ---------- */

window.signup=async function(){

let display=$("suDisplay").value.trim();
let username=$("suUser").value.trim().toLowerCase();
let password=$("suPass").value;

if(
!display ||
!/^[a-z0-9_]{3,24}$/.test(username) ||
password.length<6
){

return say(
"Enter a display name, a valid username and a password with at least 6 characters."
);

}

try{

/*
Firebase Auth requires an email.
Nexa users don't need to see an email.
We create an internal email from the username.
*/

let email=username+"@nexa.local";

let credential=
await createUserWithEmailAndPassword(
auth,
email,
password
);

let user=credential.user;


/* Check username */

let usernameQuery=query(
collection(db,"users"),
where("username","==",username)
);

let existing=await getDocs(usernameQuery);

if(!existing.empty){

await signOut(auth);

return say("That username is already taken.");

}


/* Create public Nexa profile */

await setDoc(
doc(db,"users",user.uid),
{
id:user.uid,
display_name:display,
username:username,
avatar_url:"",
created:serverTimestamp(),
online:true
}
);

}
catch(error){

console.error(error);

if(error.code==="auth/email-already-in-use")
say("That username is already registered.");

else if(error.code==="auth/weak-password")
say("Password must be at least 6 characters.");

else
say("Could not create the account.");

}

};


/* ---------- LOGIN ---------- */

window.login=async function(){

let username=$("liUser").value.trim().toLowerCase();
let password=$("liPass").value;

if(!username || !password)
return say("Enter your username and password.");

try{

let email=username+"@nexa.local";

await signInWithEmailAndPassword(
auth,
email,
password
);

}
catch(error){

console.error(error);

say("Wrong username or password.");

}

};


/* ---------- ENTER APP ---------- */

async function enter(user){

let snap=await getDoc(doc(db,"users",user.uid));

if(!snap.exists()){

await signOut(auth);
return;

}

me={
...snap.data(),
id:user.uid
};

await updateDoc(
doc(db,"users",user.uid),
{online:true}
);

$("auth").classList.add("hidden");
$("app").classList.remove("hidden");

render();

loadFriendsRealtime();

showHome();

}


/* ---------- AUTH STATE ---------- */

onAuthStateChanged(auth,async user=>{

if(user){

await enter(user);

}

});


/* ---------- LOGOUT ---------- */

window.logout=async function(){

if(me){

try{

await updateDoc(
doc(db,"users",me.id),
{online:false}
);

}catch(e){}

}

await signOut(auth);

location.reload();

};


/* ---------- PROFILE ---------- */

window.toggleProfile=function(){

$("profile").classList.toggle("hidden");

};


function render(){

$("sideAvatar").src=avatar(me);
$("panelAvatar").src=avatar(me);

$("sideDisplay").textContent=me.display_name;
$("panelDisplay").textContent=me.display_name;

$("sideUser").textContent="@"+me.username;
$("panelUser").textContent="@"+me.username;

}


/* ---------- SETTINGS ---------- */

window.openSettings=function(){

$("profile").classList.add("hidden");
$("settingsPage").classList.remove("hidden");

settingPage("account");

};

window.closeSettings=function(){

$("settingsPage").classList.add("hidden");
showHome();

};


window.settingPage=function(tab,b){

document
.querySelectorAll(".settingsSide button")
.forEach(x=>x.classList.remove("active"));

if(b)b.classList.add("active");

let c=$("settingsContent");


if(tab==="account"){

c.innerHTML=`

<div class="settingSection">

<h3>Account information</h3>

<p class="small">
Your Nexa account is stored online with Firebase.
Your username is used to log in.
</p>

<div class="field">
<label>Username</label>
<input id="setUser" value="${esc(me.username)}">
</div>

<button class="primary" onclick="saveAccount()">
Save username
</button>

</div>


<div class="settingSection">

<h3>Change password</h3>

<div class="field">
<label>New password</label>
<input id="newP" type="password">
</div>

<div class="field">

<input id="newP2" type="password">

</button>

</p>

<button class="primary danger" onclick="deleteAccount()">
Delete account
</button>

</div>

`;

}


if(tab==="profile"){

c.innerHTML=`

<div class="settingSection">

<h3>Profile</h3>

<div class="uploadBox">

<img id="profilePreview"
class="preview"
src="${esc(avatar(me))}">

<div>

<label class="file">

Upload image/GIF

<input
id="avatarFile"
type="file"
accept="image/*"
hidden
onchange="filePreview(event)"
>

</label>

For a permanent online avatar, use an image URL.
</p>

</div>

</div>

<div class="field">

<label>Image or GIF URL</label>

<input
id="avatarUrl"
value="${esc(me.avatar_url || "")}"
placeholder="https://example.com/image.gif"
>

</div>

<div class="field">

<label>Display name</label>

<input
id="setDisplay"
value="${esc(me.display_name)}"
>

</div>

<button class="primary" onclick="saveProfile()">
Save profile
</button>

</div>

`;

}


if(tab==="appearance"){

c.innerHTML=`

<div class="settingSection">

<h3>Appearance</h3>

<p class="small">
Choose how Nexa feels.
</p>

<div class="field">

<label>Accent</label>

<select id="accent">

<option>Purple</option>
<option>Blue</option>
<option>Green</option>

</select>

</div>

<button class="primary" onclick="alert('Appearance saved!')">
Save appearance
</button>

</div>

`;

}


if(tab==="privacy"){

c.innerHTML=`

<div class="settingSection">

<h3>Privacy</h3>

<p class="small">
Control who can send you friend requests.
</p>

<div class="field">

<label>
Who can send you friend requests?
</label>

<select>

<option>Everyone</option>
<option>Friends of friends</option>
<option>Nobody</option>

</select>

</div>

<button class="primary"
onclick="alert('Privacy settings saved!')">
Save privacy
</button>

</div>

`;

}


if(tab==="security"){

c.innerHTML=`

<div class="settingSection">

<h3>Security</h3>

<p class="small">
Your authentication is handled by Firebase Authentication.
Nexa does not store your plain-text password.
</p>

<button class="secondary"
onclick="alert('You are logged in as @${esc(me.username)}')">
View session info
</button>

</div>

`;

}


if(tab==="notifications"){

c.innerHTML=`

<div class="settingSection">

<h3>Notifications</h3>

<p class="small">
Choose which Nexa notifications you want.
</p>

<div class="field">
<label>
<input type="checkbox" checked>
Friend requests
</label>
</div>

<div class="field">
<label>
<input type="checkbox" checked>
Messages
</label>
</div>

<div class="field">
<label>
<input type="checkbox" checked>
Mentions
</label>
</div>

<button class="primary"
onclick="alert('Notification settings saved!')">
Save notifications
</button>

</div>

`;

}

};


/* ---------- SAVE USERNAME ---------- */

window.saveAccount=async function(){

let n=$("setUser").value.trim().toLowerCase();

if(!/^[a-z0-9_]{3,24}$/.test(n))
return alert("Invalid username.");

try{

let q=query(
collection(db,"users"),
where("username","==",n)
);

let results=await getDocs(q);

if(!results.empty && results.docs[0].id!==me.id)
return alert("Username is already taken.");

await updateDoc(
doc(db,"users",me.id),
{username:n}
);

me.username=n;

render();

alert("Username updated.");

}
catch(e){

console.error(e);
alert("Could not update username.");

}

};


/* ---------- PROFILE ---------- */

window.saveProfile=async function(){

let display=$("setDisplay").value.trim();
let url=$("avatarUrl").value.trim();

if(!display)
return alert("Display name cannot be empty.");

try{

await updateDoc(
doc(db,"users",me.id),
{
display_name:display,
avatar_url:url
}
);

me.display_name=display;
me.avatar_url=url;

render();

alert("Profile updated.");

}
catch(e){

console.error(e);
alert("Could not update profile.");

}

};


window.filePreview=function(e){

let f=e.target.files[0];

if(!f)return;

if(f.size>4*1024*1024)
return alert("Please use an image/GIF under 4 MB.");

let r=new FileReader();

r.onload=()=>{

me.avatar_url=r.result;

$("profilePreview").src=r.result;

};

r.readAsDataURL(f);

};


/* ---------- PASSWORD ---------- */

window.changePassword=async function(){

let b=$("newP").value;
let c=$("newP2").value;

if(b.length<6 || b!==c)
return alert(
"New passwords must match and be at least 6 characters."
);

try{

await updatePassword(auth.currentUser,b);

alert("Password changed.");

}
catch(e){

console.error(e);

alert(
"For security, Firebase may require you to log in again before changing your password."
);

}

};

/* ---------- FRIEND TABS ---------- */

window.friendTab=async function(tab,b){

document
.querySelectorAll("#friends .tab")
.forEach(x=>x.classList.remove("active"));

if(b)b.classList.add("active");

let box=$("friendsContent");


if(tab==="add"){

box.innerHTML=`

<p class="small">
Search by username or display name.
</p>

<div class="search">

<input
id="fq"
placeholder="username or display name"
>

<button onclick="searchPeople()">
Search
</button>

</div>

<div id="results"></div>

`;

return;

}


if(tab==="pending"){

let q=query(
collection(db,"friendships"),
where("members","array-contains",me.id)
);

let snap=await getDocs(q);

let rows=snap.docs
.map(x=>({id:x.id,...x.data()}))
.filter(r=>r.status==="pending");

if(!rows.length){

box.innerHTML=
'<p class="small">No pending requests.</p>';

return;

}

let html="";

for(let r of rows){

let otherId=
r.user_id===me.id ? r.friend_id : r.user_id;

let pSnap=await getDoc(
doc(db,"users",otherId)
);

if(!pSnap.exists())continue;

let p=pSnap.data();

let incoming=r.friend_id===me.id;

html+=`

<div class="request">

<img
class="avatar"
src="${esc(avatar(p))}"
>

<div>

<b>${esc(p.display_name)}</b>

<div class="small">
@${esc(p.username)}
·
${incoming?"sent you a request":"request sent"}
</div>

</div>

${incoming ? `

<div class="actions">

<button
class="yes"
onclick="respond('${r.id}',true)">
Accept
</button>

<button
onclick="respond('${r.id}',false)">
Decline
</button>

</div>

`:""}

</div>

`;

}

box.innerHTML=html;

return;

}


let friends=await getFriends();

if(tab==="online")
friends=friends.filter(x=>x.online);

if(tab==="offline")
friends=friends.filter(x=>!x.online);

box.innerHTML=
friends.length
?friends.map(friendHTML).join("")
:'<p class="small">No friends here yet.</p>';

};

/* ---------- SEND FRIEND REQUEST ---------- */

window.sendFriend=async function(id){

if(id===me.id)
return;

try{

let q=query(
collection(db,"friendships"),
where("members","array-contains",me.id)
);

let snap=await getDocs(q);

let already=snap.docs.some(x=>{

let r=x.data();

return r.user_id===id ||
r.friend_id===id;

});

if(already)
return alert(
"A friendship or request already exists."
);

await setDoc(
doc(collection(db,"friendships")),
{
user_id:me.id,
friend_id:id,
members:[me.id,id],
status:"pending",
created:serverTimestamp()
}
);

alert("Friend request sent!");

}
catch(e){

console.error(e);

alert("Could not send friend request.");

}

};


/* ---------- RESPOND ---------- */

window.respond=async function(id,yes){

try{

await updateDoc(
doc(db,"friendships",id),
{
status:yes?"accepted":"declined"
}
);

friendTab("pending");

}
catch(e){

console.error(e);

alert("Could not update request.");

}

};


/* ---------- GET FRIENDS ---------- */

async function getFriends(){

let q=query(
collection(db,"friendships"),
where("members","array-contains",me.id)
);

let snap=await getDocs(q);

let result=[];

for(let x of snap.docs){

let r=x.data();

if(r.status!=="accepted")
continue;

let otherId=
r.user_id===me.id
?r.friend_id
:r.user_id;

let uSnap=await getDoc(
doc(db,"users",otherId)
);

if(uSnap.exists())
result.push(uSnap.data());

}

return result;

}
