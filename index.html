<script type="module">

/*
=========================================================
NEXA ONLINE DATABASE
=========================================================

IMPORTANT:

Put your Firebase Web App config below.

Example:

const firebaseConfig = {
 apiKey: "...",
 authDomain: "...",
 projectId: "...",
 storageBucket: "...",
 messagingSenderId: "...",
 appId: "..."
};

The rest of this file is already connected to Firestore.
=========================================================
*/

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
getFirestore,
collection,
doc,
getDoc,
getDocs,
setDoc,
updateDoc,
deleteDoc,
query,
where,
onSnapshot
}
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

import {
getAuth,
signInAnonymously,
onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


/* =====================================================
   FIREBASE CONFIG
   ===================================================== */

const firebaseConfig = {

apiKey:"PASTE_YOUR_FIREBASE_API_KEY",

authDomain:"PASTE_YOUR_PROJECT.firebaseapp.com",

projectId:"PASTE_YOUR_PROJECT_ID",

storageBucket:"PASTE_YOUR_PROJECT.firebasestorage.app",

messagingSenderId:"PASTE_YOUR_SENDER_ID",

appId:"PASTE_YOUR_APP_ID"

};


/* =====================================================
   INITIALIZE
   ===================================================== */

let firebaseApp;
let firestore;
let auth;

try{

firebaseApp=initializeApp(firebaseConfig);

firestore=getFirestore(firebaseApp);

auth=getAuth(firebaseApp);

}catch(error){

console.error(error);

document.getElementById("message").innerHTML=
'<div class="msg">Firebase is not configured yet. Put your Firebase Web App configuration into the code.</div>';

}


/* =====================================================
   GLOBAL STATE
   ===================================================== */

let me=null;
let firebaseUser=null;
let unsubscribeUsers=null;
let unsubscribeFriends=null;


/* =====================================================
   HELPERS
   ===================================================== */

function $(id){
return document.getElementById(id);
}

window.$=$;


function avatar(u){

return u.avatar_url ||
"https://api.dicebear.com/9.x/fun-emoji/svg?seed="+
encodeURIComponent(u.username);

}


function esc(x){

return String(x||"")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


function say(t){

$("message").innerHTML=
'<div class="msg">'+esc(t)+'</div>';

}


function makeId(){

return crypto.randomUUID();

}


/* =====================================================
   PASSWORD HASH
   ===================================================== */

async function pass(password){

const data=
new TextEncoder().encode(password);

const hash=
await crypto.subtle.digest(
"SHA-256",
data
);

return Array.from(
new Uint8Array(hash)
)
.map(b=>b.toString(16).padStart(2,"0"))
.join("");

}


/* =====================================================
   AUTH UI
   ===================================================== */

window.loginView=function(){

$("login").classList.remove("hidden");

$("signup").classList.add("hidden");

$("message").innerHTML="";

};


window.signupView=function(){

$("signup").classList.remove("hidden");

$("login").classList.add("hidden");

$("message").innerHTML="";

};


/* =====================================================
   SIGN UP
   ===================================================== */

window.signup=async function(){

try{

if(!firebaseUser){

await signInAnonymously(auth);

}

let display=
$("suDisplay").value.trim();

let username=
$("suUser").value.trim().toLowerCase();

let password=
$("suPass").value;

if(
!display ||
!/^[a-z0-9_]{3,24}$/.test(username) ||
password.length<6
){

return say(
"Enter a display name, a valid username and a password with at least 6 characters."
);

}


const usersRef=
collection(firestore,"users");

const usernameQuery=
query(
usersRef,
where("username","==",username)
);

const existing=
await getDocs(usernameQuery);

if(!existing.empty){

return say(
"That username is already taken."
);

}


const id=makeId();

const passwordHash=
await pass(password);

const user={

id:id,

display_name:display,

username:username,

password:passwordHash,

avatar_url:"",

created:Date.now(),

last_seen:Date.now(),

online:true

};


await setDoc(
doc(firestore,"users",id),
user
);


/*
Save local session only as an ID.
Actual account data remains online.
*/

localStorage.setItem(
"nexa_online_session",
id
);

await enter(user);

}catch(error){

console.error(error);

say(
"Could not create the account. Check your Firebase configuration and Firestore rules."
);

}

};


/* =====================================================
   LOGIN
   ===================================================== */

window.login=async function(){

try{

if(!firebaseUser){

await signInAnonymously(auth);

}

const username=
$("liUser").value.trim().toLowerCase();

const password=
$("liPass").value;

const passwordHash=
await pass(password);

const usersRef=
collection(firestore,"users");

const q=
query(
usersRef,
where("username","==",username)
);

const result=
await getDocs(q);

if(result.empty){

return say(
"Wrong username or password."
);

}

let user=null;

result.forEach(snapshot=>{

const data=snapshot.data();

if(data.password===passwordHash){

user={
...data,
id:snapshot.id
};

}

});


if(!user){

return say(
"Wrong username or password."
);

}


await updateDoc(
doc(firestore,"users",user.id),
{
online:true,
last_seen:Date.now()
}
);


localStorage.setItem(
"nexa_online_session",
user.id
);

await enter(user);

}catch(error){

console.error(error);

say(
"Login failed. Check your Firebase configuration and Firestore rules."
);

}

};


/* =====================================================
   ENTER APP
   ===================================================== */

async function enter(user){

me=user;

$("auth").classList.add("hidden");

$("app").classList.remove("hidden");

render();

loadFriends();

showHome();

startRealtime();

}


/* =====================================================
   RENDER PROFILE
   ===================================================== */

function render(){

$("sideAvatar").src=avatar(me);

$("panelAvatar").src=avatar(me);

$("sideDisplay").textContent=
me.display_name;

$("panelDisplay").textContent=
me.display_name;

$("sideUser").textContent=
"@"+me.username;

$("panelUser").textContent=
"@"+me.username;

}


/* =====================================================
   LOGOUT
   ===================================================== */

window.logout=async function(){

try{

if(me){

await updateDoc(
doc(firestore,"users",me.id),
{
online:false,
last_seen:Date.now()
}
);

}

}catch(e){

console.error(e);

}

localStorage.removeItem(
"nexa_online_session"
);

location.reload();

};


/* =====================================================
   PROFILE
   ===================================================== */

window.toggleProfile=function(){

$("profile").classList.toggle("hidden");

/* =====================================================

   ===================================================== */

$("profile").classList.add("hidden");

$("settingsPage").classList.remove("hidden");

settingPage("account");

window.closeSettings=function(){

$("settingsPage").classList.add("hidden");

showHome();

if(tab==="account"){

`;

}


if(tab==="profile"){

c.innerHTML=`

id="profilePreview"
class="preview"

<div>

</label>

For this one-file version, image URLs are recommended.

</div>

</div>

<input
id="avatarUrl"
value="${esc(me.avatar_url||"")}"
placeholder="https://example.com/image.gif">

</div>


<div class="field">

<label>Display name</label>

<input
id="setDisplay"
value="${esc(me.display_name)}">

</div>


<button
class="primary"
onclick="saveProfile()">

window.saveAccount=async function(){

let n=
$("setUser").value.trim().toLowerCase();

if(!/^[a-z0-9_]{3,24}$/.test(n)){

return alert("Invalid username.");

}


try{

const usersRef=
collection(firestore,"users");

const q=
query(
usersRef,
where("username","==",n)
);

const result=
await getDocs(q);

let taken=false;

result.forEach(snapshot=>{

if(snapshot.id!==me.id){

taken=true;

}

});

if(taken){

return alert(
"Username is already taken."
);

}


await updateDoc(
doc(firestore,"users",me.id),
{
username:n
}
);

me.username=n;

render();

alert(
"Username updated."
);

}catch(error){

console.error(error);

alert(
"Could not update username."
);

}

};

window.changePassword=async function(){

return alert(

try{

const current=
await pass(a);

const newHash=
await pass(b);

const snapshot=
await getDoc(
doc(firestore,"users",me.id)
);

const user=snapshot.data();

if(user.password!==current){

);

}

doc(firestore,"users",me.id),
{
password:newHash
}
);

alert(

);

}catch(error){

alert(

);

}

};

))return;

collection(firestore,"friendships");

const q1=query(
friendships,
where("user_id","==",me.id)
);

const q2=query(
friendships,
where("friend_id","==",me.id)
);

const [a,b]=await Promise.all([
getDocs(q1),
getDocs(q2)
]);

for(const snapshot of a.docs){

await deleteDoc(snapshot.ref);

}

for(const snapshot of b.docs){

await deleteDoc(snapshot.ref);

}


await deleteDoc(
doc(firestore,"users",me.id)
);

logout();

}catch(error){

console.error(error);

alert(
"Could not delete account."
);

}

};

/* =====================================================
   GET FRIENDS
   ===================================================== */

async function getFriends(){

const friendships=
collection(firestore,"friendships");

const q1=query(
friendships,
where("user_id","==",me.id),
where("status","==","accepted")
);

const q2=query(
friendships,
where("friend_id","==",me.id),
where("status","==","accepted")
);

const [a,b]=await Promise.all([
getDocs(q1),
getDocs(q2)
]);

const ids=[];

a.forEach(x=>ids.push(x.data().friend_id));

b.forEach(x=>ids.push(x.data().user_id));

const result=[];

for(const id of ids){

const userSnap=
await getDoc(
doc(firestore,"users",id)
);

if(userSnap.exists()){

result.push({
...userSnap.data(),
id:userSnap.id
});

}

}

return result;

}

collection(firestore,"friendships");

where("friend_id","==",id)
);

);

]);

);

{

status:"pending",

created:Date.now()

}
);

);

}catch(error){

);

}

};


/* =====================================================
   PENDING REQUESTS
   ===================================================== */

async function renderPending(){

let box=$("friendsContent");

try{

const friendships=
collection(firestore,"friendships");

const q1=query(
friendships,
where("user_id","==",me.id),
where("status","==","pending")
);

const q2=query(
friendships,
where("friend_id","==",me.id),
where("status","==","pending")
);

const [a,b]=await Promise.all([
getDocs(q1),
getDocs(q2)
]);

const rows=[
...a.docs,
...b.docs
];


if(!rows.length){

box.innerHTML=
'<p class="small">No pending requests.</p>';

return;

}


let html="";


for(const snapshot of rows){

const r=snapshot.data();

const incoming=
r.friend_id===me.id;

const otherId=
incoming
?
r.user_id
:
r.friend_id;

const userSnapshot=
await getDoc(
doc(firestore,"users",otherId)
);

if(!userSnapshot.exists())continue;

const p={
...userSnapshot.data(),
id:userSnapshot.id
};


html+=`

<div class="request">

<img
class="avatar"
src="${esc(avatar(p))}">

<div>

<b>
${esc(p.display_name)}
</b>

<div class="small">
@${esc(p.username)}
·
${incoming
?"sent you a request"
:"request sent"}
</div>

</div>

${
incoming
?
`

<div class="actions">

<button
class="yes"
onclick="respond('${snapshot.id}',true)">

Accept

</button>

<button
onclick="respond('${snapshot.id}',false)">

Decline

</button>

</div>

`
:""

}

</div>

`;

}


box.innerHTML=
html ||
'<p class="small">No pending requests.</p>';

}catch(error){

console.error(error);

box.innerHTML=
'<p class="small">Could not load requests.</p>';

}

}

/* =====================================================
   REALTIME UPDATES
   ===================================================== */

function startRealtime(){

if(unsubscribeUsers){

unsubscribeUsers();

}

if(unsubscribeFriends){

unsubscribeFriends();

}


/*
Watch users so online/offline state updates.
*/

unsubscribeUsers=
onSnapshot(
collection(firestore,"users"),
async()=>{

if(me){

await loadFriends();

}

}
);


/*
Watch friendships so requests update instantly.
*/

unsubscribeFriends=
onSnapshot(
collection(firestore,"friendships"),
async()=>{

if(me){

await loadFriends();

}

}
);

}


/* =====================================================
   RESTORE SESSION
   ===================================================== */

async function restoreSession(){

const id=
localStorage.getItem(
"nexa_online_session"
);

if(!id)return;


try{

const snapshot=
await getDoc(
doc(firestore,"users",id)
);

if(!snapshot.exists()){

localStorage.removeItem(
"nexa_online_session"
);

return;

}

const user={
...snapshot.data(),
id:snapshot.id
};

await updateDoc(
doc(firestore,"users",id),
{
online:true,
last_seen:Date.now()
}
);

await enter(user);

}catch(error){

console.error(error);

}

}
