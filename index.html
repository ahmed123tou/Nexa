<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexa — Chat & Hangout</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
}

body{
    background:#07070a;
    color:#f5f5f7;
    font-family:Arial,Helvetica,sans-serif;
    overflow:hidden;
}

/* APP */
.app{
    width:100%;
    height:100vh;
    display:flex;
    background:#07070a;
}

/* SIDEBAR */
.sidebar{
    width:250px;
    height:100%;
    background:#0b0b0f;
    border-right:1px solid #202027;
    display:flex;
    flex-direction:column;
}

.logo{
    height:72px;
    display:flex;
    align-items:center;
    gap:12px;
    padding:0 20px;
    border-bottom:1px solid #202027;
}

.logoIcon{
    width:39px;
    height:39px;
    border-radius:12px;
    background:linear-gradient(135deg,#7c3aed,#a855f7);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:21px;
    font-weight:bold;
    box-shadow:0 0 30px rgba(139,92,246,.25);
}

.logoText{
    font-size:23px;
    font-weight:bold;
}

.logoText span{
    color:#a78bfa;
}

.navigation{
    padding:18px 12px;
}

.navTitle{
    font-size:10px;
    color:#606069;
    font-weight:bold;
    letter-spacing:1.5px;
    padding:0 10px 9px;
}

.navItem{
    width:100%;
    height:44px;
    display:flex;
    align-items:center;
    gap:12px;
    padding:0 12px;
    margin-bottom:4px;
    border-radius:10px;
    color:#92929c;
    cursor:pointer;
    transition:.15s;
}

.navItem:hover{
    background:#151519;
    color:#fff;
}

.navItem.active{
    background:#8b5cf61c;
    color:#c4b5fd;
}

.navIcon{
    width:22px;
    text-align:center;
    font-size:18px;
}

/* USER */
.userArea{
    margin-top:auto;
    padding:13px;
    border-top:1px solid #202027;
}

.user{
    background:#111114;
    border:1px solid #24242b;
    border-radius:12px;
    padding:9px;
    display:flex;
    align-items:center;
    gap:10px;
}

.avatar{
    width:40px;
    height:40px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,#8b5cf6,#ec4899);
    font-weight:bold;
    flex-shrink:0;
}

.userInfo{
    flex:1;
}

.username{
    font-size:13px;
    font-weight:bold;
}

.status{
    color:#39d98a;
    font-size:11px;
    margin-top:3px;
}

.more{
    border:0;
    background:none;
    color:#777;
    font-size:20px;
    cursor:pointer;
}

/* MAIN */
.main{
    flex:1;
    min-width:0;
    height:100%;
    display:flex;
    flex-direction:column;
}

.topbar{
    height:72px;
    flex-shrink:0;
    background:#0a0a0d;
    border-bottom:1px solid #202027;
    display:flex;
    align-items:center;
    padding:0 24px;
    gap:14px;
}

.topTitle{
    font-size:20px;
    font-weight:bold;
}

.topSpacer{
    flex:1;
}

.topButton{
    height:38px;
    border:1px solid #28282f;
    background:#111114;
    color:#b9b9c2;
    border-radius:9px;
    padding:0 14px;
    cursor:pointer;
}

.topButton:hover{
    color:white;
    border-color:#44444d;
}

.content{
    flex:1;
    overflow:auto;
    padding:30px;
}

/* HOME */
.container{
    max-width:1100px;
    margin:auto;
}

.hero{
    padding:28px 0 30px;
}

.hero h1{
    font-size:40px;
    letter-spacing:-1.5px;
}

.hero h1 span{
    color:#a78bfa;
}

.hero p{
    margin-top:10px;
    color:#85858f;
    font-size:15px;
}

.cards{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:16px;
}

.card{
    background:#0e0e11;
    border:1px solid #222229;
    border-radius:15px;
    padding:20px;
    transition:.2s;
}

.card:hover{
    border-color:#36363e;
    transform:translateY(-2px);
}

.card.large{
    grid-column:span 2;
}

.cardIcon{
    width:44px;
    height:44px;
    border-radius:12px;
    background:#8b5cf61b;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:21px;
    margin-bottom:15px;
}

.card h3{
    font-size:16px;
    margin-bottom:7px;
}

.card p{
    color:#80808a;
    font-size:13px;
    line-height:1.55;
}

.friendPreview{
    display:flex;
    margin-top:18px;
}

.miniAvatar{
    width:35px;
    height:35px;
    margin-left:-5px;
    border-radius:50%;
    border:2px solid #0e0e11;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,#6366f1,#8b5cf6);
    font-size:11px;
    font-weight:bold;
}

.miniAvatar:first-child{
    margin-left:0;
}

.primary{
    margin-top:16px;
    border:1px solid #8b5cf6;
    background:#8b5cf6;
    color:white;
    padding:9px 13px;
    border-radius:9px;
    cursor:pointer;
}

.secondary{
    margin-top:16px;
    border:1px solid #292930;
    background:#151518;
    color:#aaa;
    padding:9px 13px;
    border-radius:9px;
    cursor:pointer;
}

/* PAGE */
.page{
    max-width:1100px;
    margin:auto;
}

.pageHeader{
    margin-bottom:22px;
}

.pageHeader h1{
    font-size:29px;
}

.pageHeader p{
    margin-top:6px;
    color:#777781;
    font-size:14px;
}

/* FRIENDS */
.tabs{
    display:flex;
    border-bottom:1px solid #222229;
    margin-bottom:20px;
}

.tab{
    border:0;
    background:none;
    color:#777781;
    padding:12px 15px;
    cursor:pointer;
    border-bottom:2px solid transparent;
}

.tab:hover{
    color:#fff;
}

.tab.active{
    color:#c4b5fd;
    border-color:#8b5cf6;
}

.friendList{
    display:flex;
    flex-direction:column;
    gap:9px;
}

.friend{
    display:flex;
    align-items:center;
    gap:12px;
    background:#0e0e11;
    border:1px solid #222229;
    border-radius:12px;
    padding:13px;
}

.friendInfo{
    flex:1;
}

.friendInfo strong{
    font-size:14px;
}

.friendInfo p{
    margin-top:4px;
    color:#73737c;
    font-size:12px;
}

.onlineDot{
    display:inline-block;
    width:8px;
    height:8px;
    border-radius:50%;
    background:#39d98a;
    margin-right:5px;
}

.actions{
    display:flex;
    gap:7px;
}

.action{
    border:1px solid #292930;
    background:#151518;
    color:#aaa;
    padding:8px 11px;
    border-radius:8px;
    cursor:pointer;
}

.action:hover{
    color:white;
}

/* CHAT */
.chatLayout{
    height:100%;
    margin:-30px;
    display:flex;
}

.chatList{
    width:275px;
    flex-shrink:0;
    background:#09090c;
    border-right:1px solid #202027;
    padding:15px;
}

.search{
    width:100%;
    height:40px;
    border-radius:9px;
    border:1px solid #25252c;
    background:#121215;
    color:white;
    padding:0 12px;
    outline:none;
    margin-bottom:12px;
}

.search:focus{
    border-color:#7656c9;
}

.chatUser{
    display:flex;
    align-items:center;
    gap:10px;
    padding:9px;
    border-radius:10px;
    cursor:pointer;
    margin-bottom:3px;
}

.chatUser:hover,
.chatUser.active{
    background:#16161a;
}

.chatUser .avatar{
    width:38px;
    height:38px;
}

.chatInfo{
    min-width:0;
}

.chatInfo strong{
    font-size:13px;
}

.chatInfo p{
    margin-top:3px;
    font-size:11px;
    color:#686871;
}

.chat{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
}

.chatHeader{
    height:64px;
    flex-shrink:0;
    border-bottom:1px solid #202027;
    display:flex;
    align-items:center;
    gap:10px;
    padding:0 20px;
}

.chatHeader .avatar{
    width:36px;
    height:36px;
}

.chatHeaderInfo strong{
    font-size:14px;
}

.chatHeaderInfo p{
    margin-top:3px;
    color:#696971;
    font-size:11px;
}

.messages{
    flex:1;
    overflow:auto;
    padding:25px;
}

.message{
    display:flex;
    gap:11px;
    max-width:760px;
    margin-bottom:20px;
}

.message .avatar{
    width:38px;
    height:38px;
}

.bubble{
    background:#111114;
    border:1px solid #25252c;
    border-radius:11px;
    padding:10px 13px;
}

.messageName{
    color:#c4b5fd;
    font-size:12px;
    font-weight:bold;
    margin-bottom:4px;
}

.messageText{
    color:#ddd;
    font-size:13px;
    line-height:1.5;
}

.message.me{
    margin-left:auto;
    flex-direction:row-reverse;
}

.message.me .bubble{
    background:#251a3f;
    border-color:#3d2868;
}

.chatInput{
    padding:15px;
    border-top:1px solid #202027;
    display:flex;
    gap:9px;
}

.chatInput input{
    flex:1;
    height:44px;
    background:#121215;
    border:1px solid #25252c;
    color:white;
    border-radius:9px;
    padding:0 13px;
    outline:none;
}

.send{
    width:46px;
    border:0;
    border-radius:9px;
    background:#8b5cf6;
    color:white;
    cursor:pointer;
    font-size:17px;
}

/* PROFILE */
.banner{
    height:110px;
    background:linear-gradient(135deg,#6d28d9,#9333ea,#4c1d95);
}

.profileBody{
    padding:0 20px 22px;
}

.profileAvatar{
    width:82px;
    height:82px;
    border:5px solid #0e0e11;
    margin-top:-41px;
    font-size:25px;
}

/* MODAL */
.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.68);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:100;
    backdrop-filter:blur(5px);
}

.modal.show{
    display:flex;
}

.modalCard{
    width:390px;
    background:#101012;
    border:1px solid #2b2b32;
    border-radius:16px;
    overflow:hidden;
}

.modalBody{
    position:relative;
    padding:0 20px 20px;
}

.close{
    position:absolute;
    right:14px;
    top:14px;
    width:32px;
    height:32px;
    border:0;
    border-radius:50%;
    background:rgba(0,0,0,.5);
    color:white;
    font-size:18px;
    cursor:pointer;
}

/* SETTINGS */
.section{
    background:#0e0e11;
    border:1px solid #222229;
    border-radius:13px;
    margin-bottom:15px;
    overflow:hidden;
}

.sectionTitle{
    padding:17px 18px;
    border-bottom:1px solid #222229;
    font-size:14px;
    font-weight:bold;
}

.setting{
    display:flex;
    align-items:center;
    gap:15px;
    padding:15px 18px;
    border-bottom:1px solid #1b1b20;
}

.setting:last-child{
    border-bottom:0;
}

.settingInfo{
    flex:1;
}

.settingInfo strong{
    display:block;
    font-size:13px;
}

.settingInfo span{
    display:block;
    margin-top:4px;
    color:#707079;
    font-size:11px;
}

.toggle{
    width:42px;
    height:23px;
    border-radius:20px;
    background:#29292e;
    position:relative;
    cursor:pointer;
}

.toggle:after{
    content:"";
    position:absolute;
    width:17px;
    height:17px;
    border-radius:50%;
    background:#777;
    left:3px;
    top:3px;
    transition:.2s;
}

.toggle.on{
    background:#7c3aed;
}

.toggle.on:after{
    left:22px;
    background:white;
}

/* TOAST */
.toast{
    position:fixed;
    right:22px;
    bottom:22px;
    background:#17171b;
    border:1px solid #303038;
    color:#ddd;
    padding:12px 15px;
    border-radius:10px;
    font-size:13px;
    opacity:0;
    transform:translateY(15px);
    transition:.2s;
    pointer-events:none;
    z-index:200;
}

.toast.show{
    opacity:1;
    transform:translateY(0);
}

/* MOBILE */
@media(max-width:800px){
    .sidebar{
        width:70px;
    }

    .logo{
        justify-content:center;
        padding:0;
    }

    .logoText,
    .navTitle,
    .navItem span,
    .userInfo,
    .more{
        display:none;
    }

    .navItem{
        justify-content:center;
        padding:0;
    }

    .userArea{
        padding:9px;
    }

    .user{
        justify-content:center;
    }

    .cards{
        grid-template-columns:1fr;
    }

    .card.large{
        grid-column:span 1;
    }

    .chatList{
        width:75px;
    }

    .chatInfo,
    .chatList .search{
        display:none;
    }

    .chatUser{
        justify-content:center;
    }
}

@media(max-width:520px){
    .sidebar{
        display:none;
    }

    .content{
        padding:18px;
    }

    .topbar{
        padding:0 15px;
    }

    .hero h1{
        font-size:30px;
    }

    .chatList{
        display:none;
    }

    .messages{
        padding:15px;
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div class="logo">
            <div class="logoIcon">N</div>
            <div class="logoText">Ne<span>xa</span></div>
        </div>

        <nav class="navigation">

            <div class="navTitle">NEXA</div>

            <div class="navItem active" onclick="navigate('home',this)">
                <div class="navIcon">🏠</div>
                <span>Home</span>
            </div>

            <div class="navItem" onclick="navigate('friends',this)">
                <div class="navIcon">👥</div>
                <span>Friends</span>
            </div>

            <div class="navItem" onclick="navigate('messages',this)">
                <div class="navIcon">💬</div>
                <span>Messages</span>
            </div>

            <div class="navItem" onclick="navigate('explore',this)">
                <div class="navIcon">🔎</div>
                <span>Explore</span>
            </div>

            <div class="navTitle" style="margin-top:22px">PERSONAL</div>

            <div class="navItem" onclick="navigate('profile',this)">
                <div class="navIcon">👤</div>
                <span>My Profile</span>
            </div>

            <div class="navItem" onclick="navigate('settings',this)">
                <div class="navIcon">⚙️</div>
                <span>Settings</span>
            </div>

        </nav>

        <div class="userArea">
            <div class="user">
                <div class="avatar">A</div>

                <div class="userInfo">
                    <div class="username">Ahmed</div>
                    <div class="status">● Online</div>
                </div>

                <button class="more" onclick="openProfile()">⋯</button>
            </div>
        </div>

    </aside>

    <!-- MAIN -->
    <main class="main">

        <header class="topbar">
            <button class="topButton" onclick="toast('Nexa is running offline ✨')">
                Nexa
            </button>

            <div class="topTitle" id="pageTitle">Home</div>

            <div class="topSpacer"></div>

            <button class="topButton" onclick="openProfile()">
                👤 Profile
            </button>
        </header>

        <div class="content" id="content"></div>

    </main>

</div>


<!-- PROFILE MODAL -->
<div class="modal" id="profileModal" onclick="closeProfile(event)">

    <div class="modalCard" onclick="event.stopPropagation()">

        <div class="banner"></div>

        <div class="modalBody">

            <button class="close" onclick="closeProfile()">×</button>

            <div class="avatar profileAvatar">A</div>

            <h2 style="margin-top:10px">Ahmed</h2>

            <div style="color:#777;font-size:12px;margin-top:3px">
                @ahmed
            </div>

            <div style="
                background:#151518;
                border:1px solid #25252c;
                border-radius:9px;
                padding:12px;
                margin-top:16px;
                color:#aaa;
                font-size:12px;
                line-height:1.5;
            ">
                Welcome to my Nexa profile! 👋<br>
                Hanging out, chatting and having fun.
            </div>

            <button class="primary" style="width:100%"
                onclick="toast('Profile editing is offline for now')">
                ✏️ Edit Profile
            </button>

        </div>

    </div>

</div>

<div class="toast" id="toast"></div>


<script>

/* ==============================
   NEXA OFFLINE SYSTEM
   ============================== */

const content = document.getElementById("content");
const pageTitle = document.getElementById("pageTitle");

const friends = [
    {
        name:"Alex",
        letter:"A",
        online:true,
        status:"Playing games"
    },
    {
        name:"Sam",
        letter:"S",
        online:true,
        status:"Hanging out"
    },
    {
        name:"Leo",
        letter:"L",
        online:false,
        status:"Offline"
    },
    {
        name:"Max",
        letter:"M",
        online:false,
        status:"Offline"
    }
];


/* HOME */

function showHome(){

    content.innerHTML = `

        <div class="container">

            <div class="hero">
                <h1>
                    Welcome back to <span>Nexa</span>.
                </h1>

                <p>
                    Your place to chat, hang out and connect with friends.
                </p>
            </div>


            <div class="cards">

                <div class="card large">

                    <div class="cardIcon">👥</div>

                    <h3>Your Friends</h3>

                    <p>
                        See your friends, check who's online
                        and start a conversation.
                    </p>

                    <div class="friendPreview">
                        <div class="miniAvatar">A</div>
                        <div class="miniAvatar">S</div>
                        <div class="miniAvatar">L</div>
                        <div class="miniAvatar">M</div>
                    </div>

                </div>


                <div class="card">

                    <div class="cardIcon">💬</div>

                    <h3>Messages</h3>

                    <p>
                        Start a conversation with one of your friends.
                    </p>

                    <button class="primary"
                        onclick="navigateByName('messages')">
                        Open Messages
                    </button>

                </div>


                <div class="card">

                    <div class="cardIcon">🔎</div>

                    <h3>Explore</h3>

                    <p>
                        Discover what Nexa has to offer.
                    </p>

                    <button class="secondary"
                        onclick="navigateByName('explore')">
                        Explore
                    </button>

                </div>


                <div class="card">

                    <div class="cardIcon">✨</div>

                    <h3>Offline Nexa</h3>

                    <p>
                        This version runs completely on your device.
                        No account, Firebase, database or online connection
                        is required.
                    </p>

                </div>

            </div>

        </div>
    `;
}


/* FRIENDS */

function showFriends(){

    content.innerHTML = `

        <div class="page">

            <div class="pageHeader">

                <h1>Friends</h1>

                <p>
                    Manage your friends and see who's around.
                </p>

            </div>


            <div class="tabs">

                <button class="tab active"
                    onclick="friendTab(this,'all')">
                    All
                </button>

                <button class="tab"
                    onclick="friendTab(this,'online')">
                    Online
                </button>

                <button class="tab"
                    onclick="friendTab(this,'offline')">
                    Offline
                </button>

                <button class="tab"
                    onclick="friendTab(this,'pending')">
                    Pending
                </button>

                <button class="tab"
                    onclick="friendTab(this,'add')">
                    Add a friend
                </button>

            </div>


            <div class="friendList" id="friendList"></div>

        </div>
    `;

    renderFriends("all");
}


function renderFriends(type){

    const list = document.getElementById("friendList");

    if(type === "pending"){

        list.innerHTML = `
            <div class="card">

                <div class="cardIcon">📨</div>

                <h3>No pending requests</h3>

                <p>
                    You don't have any friend requests right now.
                </p>

            </div>
        `;

        return;
    }


    if(type === "add"){

        list.innerHTML = `

            <div class="card">

                <div class="cardIcon">➕</div>

                <h3>Add a friend</h3>

                <p>
                    Enter a username to send a friend request.
                </p>

                <div style="
                    display:flex;
                    gap:8px;
                    margin-top:15px;
                ">

                    <input
                        class="search"
                        id="friendInput"
                        style="margin:0"
                        placeholder="Enter username..."
                    >

                    <button
                        class="primary"
                        style="margin:0"
                        onclick="addFriend()">
                        Add
                    </button>

                </div>

            </div>
        `;

        return;
    }


    let data = friends;

    if(type === "online"){
        data = friends.filter(friend => friend.online);
    }

    if(type === "offline"){
        data = friends.filter(friend => !friend.online);
    }


    list.innerHTML = data.map(friend => `

        <div class="friend">

            <div class="avatar">
                ${friend.letter}
            </div>

            <div class="friendInfo">

                <strong>${friend.name}</strong>

                <p>
                    ${
                        friend.online
                        ? '<span class="onlineDot"></span>Online'
                        : 'Offline'
                    }

                    · ${friend.status}

function sendMessage(){

    const input =
        document.getElementById("messageInput");

    const text = input.value.trim();

    if(!text){
        return;
    }

    const messages =
        document.getElementById("messages");

    const message =
        document.createElement("div");

    message.className = "message me";

    message.innerHTML = `

        <div class="avatar">
            A
        </div>

        <div class="bubble">

            <div class="messageName">
                Ahmed
            </div>

            <div class="messageText"></div>

        </div>
    `;

    message
        .querySelector(".messageText")
        .textContent = text;

    messages.appendChild(message);

    input.value = "";

    messages.scrollTop =
        messages.scrollHeight;
}


function selectChat(name,element){

    document
        .querySelectorAll(".chatUser")
        .forEach(user => {
            user.classList.remove("active");
        });

    element.classList.add("active");

    const friend =
        friends.find(f => f.name === name);

    document.getElementById("chatName")
        .textContent = name;

    document.getElementById("chatStatus")
        .textContent =
        friend && friend.online
        ? "Online"
        : "Offline";

    document.getElementById("messageInput")
        .placeholder =
        "Message " + name + "...";
}


function filterChats(value){

    value = value.toLowerCase();

    document
        .querySelectorAll(".chatUser")
        .forEach(user => {

            user.style.display =
                user.textContent
                .toLowerCase()
                .includes(value)
                ? "flex"
                : "none";

        });
}


function openChat(name){

    navigateByName("messages");

    setTimeout(() => {

        document
            .querySelectorAll(".chatUser")
            .forEach(user => {

                if(user.textContent.includes(name)){
                    selectChat(name,user);
                }

            });

    },50);
}

/* NAVIGATION */

function navigate(page,clickedElement){

    document
        .querySelectorAll(".navItem")
        .forEach(item => {
            item.classList.remove("active");
        });

    if(clickedElement){
        clickedElement.classList.add("active");
    }

    const titles = {
        home:"Home",
        friends:"Friends",
        messages:"Messages",
        explore:"Explore",
        profile:"My Profile",
        settings:"Settings"
    };

    pageTitle.textContent = titles[page];


    if(page === "home"){
        showHome();
    }

    if(page === "friends"){
        showFriends();
    }

    if(page === "messages"){
        showMessages();
    }

    if(page === "explore"){
        showExplore();
    }

    if(page === "profile"){
        showProfile();
    }

    if(page === "settings"){
        showSettings();
    }
}


function navigateByName(page){

    const item =
        [...document.querySelectorAll(".navItem")]
        .find(x =>
            x.getAttribute("onclick")
            .includes("'" + page + "'")
        );

    navigate(page,item);
}


/* PROFILE MODAL */

function openProfile(){

    document
        .getElementById("profileModal")
        .classList.add("show");
}


function closeProfile(event){

    if(
        !event ||
        event.target.id === "profileModal"
    ){

        document
            .getElementById("profileModal")
            .classList.remove("show");

    }
}


/* TOAST */

let toastTimer;

function toast(message){

    const element =
        document.getElementById("toast");

    element.textContent = message;

    element.classList.add("show");

    clearTimeout(toastTimer);

    toastTimer = setTimeout(() => {

        element.classList.remove("show");

    },2200);
}
