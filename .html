<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Nexa — Chat & Hangout</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#070707;
  --panel:#0d0d0f;
  --panel2:#111114;
  --panel3:#17171b;
  --border:#24242a;
  --purple:#8b5cf6;
  --purple2:#a78bfa;
  --text:#f5f5f5;
  --muted:#8d8d98;
  --green:#35d07f;
  --red:#ef4444;
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:Inter,Segoe UI,Arial,sans-serif;
  min-height:100vh;
  overflow:hidden;
}

button,input{
  font:inherit;
}

button{
  cursor:pointer;
}

/* APP */
.app{
  height:100vh;
  display:flex;
}

/* SIDEBAR */
.sidebar{
  width:245px;
  background:#09090a;
  border-right:1px solid var(--border);
  display:flex;
  flex-direction:column;
  flex-shrink:0;
}

.logo{
  height:72px;
  display:flex;
  align-items:center;
  gap:11px;
  padding:0 22px;
  border-bottom:1px solid var(--border);
}

.logo-icon{
  width:36px;
  height:36px;
  border-radius:11px;
  background:linear-gradient(135deg,#7c3aed,#a855f7);
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
  font-size:19px;
  box-shadow:0 0 25px #8b5cf633;
}

.logo-name{
  font-size:21px;
  font-weight:800;
  letter-spacing:-.5px;
}

.logo-name span{
  color:var(--purple2);
}

.nav{
  padding:18px 12px;
}

.nav-title{
  color:#65656e;
  font-size:11px;
  font-weight:800;
  letter-spacing:1px;
  padding:0 10px 9px;
}

.nav-item{
  height:44px;
  border-radius:9px;
  padding:0 12px;
  display:flex;
  align-items:center;
  gap:12px;
  color:#9999a2;
  margin-bottom:4px;
  transition:.15s;
  user-select:none;
}

.nav-item:hover{
  background:#151518;
  color:#fff;
}

.nav-item.active{
  background:#8b5cf61c;
  color:#c4b5fd;
}

.nav-icon{
  width:21px;
  text-align:center;
  font-size:18px;
}

.bottom-user{
  margin-top:auto;
  padding:13px;
  border-top:1px solid var(--border);
}

.user-card{
  background:#101012;
  border:1px solid var(--border);
  border-radius:12px;
  padding:10px;
  display:flex;
  align-items:center;
  gap:10px;
}

.avatar{
  width:38px;
  height:38px;
  border-radius:50%;
  background:linear-gradient(135deg,#8b5cf6,#ec4899);
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
  flex-shrink:0;
}

.user-info{
  flex:1;
  min-width:0;
}

.user-name{
  font-size:13px;
  font-weight:700;
}

.user-status{
  color:var(--green);
  font-size:11px;
  margin-top:2px;
}

.settings-btn{
  background:none;
  border:0;
  color:#888;
  font-size:17px;
}

/* MAIN */
.main{
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
}

.topbar{
  height:72px;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  padding:0 25px;
  gap:15px;
  background:#09090a;
}

.page-title{
  font-size:20px;
  font-weight:750;
}

.topbar-spacer{
  flex:1;
}

.top-button{
  height:38px;
  padding:0 14px;
  border-radius:9px;
  border:1px solid var(--border);
  background:#111114;
  color:#bbb;
  transition:.15s;
}

.top-button:hover{
  color:white;
  border-color:#38383e;
}

.content{
  flex:1;
  overflow:auto;
  padding:28px;
}

/* HOME */
.hero{
  max-width:1100px;
  margin:0 auto;
  padding:35px 0 25px;
}

.hero h1{
  font-size:38px;
  line-height:1.1;
  letter-spacing:-1.5px;
}

.hero h1 span{
  color:var(--purple2);
}

.hero p{
  color:var(--muted);
  margin-top:10px;
  font-size:15px;
}

.cards{
  max-width:1100px;
  margin:0 auto;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:16px;
}

.card{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:15px;
  padding:20px;
  transition:.2s;
}

.card:hover{
  transform:translateY(-2px);
  border-color:#36363d;
}

.card-icon{
  width:43px;
  height:43px;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#8b5cf61b;
  font-size:20px;
  margin-bottom:16px;
}

.card h3{
  font-size:16px;
  margin-bottom:7px;
}

.card p{
  color:#85858e;
  font-size:13px;
  line-height:1.5;
}

.big-card{
  grid-column:span 2;
}

.friend-preview{
  margin-top:17px;
  display:flex;
  gap:8px;
}

.mini-avatar{
  width:32px;
  height:32px;
  border-radius:50%;
  background:linear-gradient(135deg,#6366f1,#8b5cf6);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:12px;
  font-weight:bold;
  border:2px solid #0d0d0f;
  margin-left:-5px;
}

.mini-avatar:first-child{
  margin-left:0;
}

/* FRIENDS */
.page{
  max-width:1100px;
  margin:0 auto;
}

.page-header{
  margin-bottom:22px;
}

.page-header h1{
  font-size:28px;
}

.page-header p{
  color:var(--muted);
  margin-top:6px;
  font-size:14px;
}

.tabs{
  display:flex;
  gap:5px;
  border-bottom:1px solid var(--border);
  margin-bottom:20px;
}

.tab{
  border:0;
  background:none;
  color:#777781;
  padding:12px 15px;
  border-bottom:2px solid transparent;
}

.tab:hover{
  color:white;
}

.tab.active{
  color:#c4b5fd;
  border-color:var(--purple);
}

.friend-list{
  display:flex;
  flex-direction:column;
  gap:9px;
}

.friend{
  background:#0e0e10;
  border:1px solid var(--border);
  border-radius:12px;
  padding:13px;
  display:flex;
  align-items:center;
  gap:12px;
}

.friend .avatar{
  width:44px;
  height:44px;
}

.friend-details{
  flex:1;
}

.friend-details strong{
  font-size:14px;
}

.friend-details p{
  font-size:12px;
  color:#777781;
  margin-top:3px;
}

.online-dot{
  width:9px;
  height:9px;
  background:var(--green);
  border-radius:50%;
  display:inline-block;
  margin-right:5px;
}

.friend-actions{
  display:flex;
  gap:7px;
}

.action{
  border:1px solid var(--border);
  background:#151518;
  color:#aaa;
  padding:8px 12px;
  border-radius:8px;
}

.action:hover{
  color:white;
}

.action.primary{
  background:#8b5cf6;
  border-color:#8b5cf6;
  color:white;
}

/* CHAT */
.chat-layout{
  height:calc(100vh - 72px);
  display:flex;
}

.chat-list{
  width:270px;
  border-right:1px solid var(--border);
  padding:15px;
  background:#09090a;
}

.search{
  width:100%;
  background:#121215;
  border:1px solid var(--border);
  color:white;
  padding:11px 12px;
  border-radius:9px;
  outline:none;
  margin-bottom:12px;
}

.search:focus{
  border-color:#59419b;
}

.chat-user{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px;
  border-radius:10px;
  cursor:pointer;
}

.chat-user:hover,
.chat-user.active{
  background:#151518;
}

.chat-user .avatar{
  width:38px;
  height:38px;
}

.chat-user-info{
  min-width:0;
}

.chat-user-info strong{
  font-size:13px;
}

.chat-user-info p{
  color:#66666f;
  font-size:11px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.chat{
  flex:1;
  display:flex;
  flex-direction:column;
  min-width:0;
}

.chat-header{
  height:64px;
  border-bottom:1px solid var(--border);
  padding:0 20px;
  display:flex;
  align-items:center;
  gap:10px;
}

.chat-header .avatar{
  width:35px;
  height:35px;
}

.chat-header-info strong{
  font-size:14px;
}

.chat-header-info p{
  color:#6d6d75;
  font-size:11px;
}

.messages{
  flex:1;
  overflow:auto;
  padding:25px;
}

.message{
  display:flex;
  gap:11px;
  margin-bottom:21px;
  max-width:750px;
}

.message .avatar{
  width:38px;
  height:38px;
}

.message-body{
  background:#111114;
  border:1px solid var(--border);
  border-radius:11px;
  padding:10px 13px;
}

.message-name{
  font-size:12px;
  color:#c4b5fd;
  font-weight:700;
  margin-bottom:4px;
}

.message-text{
  font-size:13px;
  color:#ddd;
  line-height:1.5;
}

.message.me{
  margin-left:auto;
  flex-direction:row-reverse;
}

.message.me .message-body{
  background:#251a3f;
  border-color:#3d2868;
}

.message.me .message-name{
  color:#ddd;
}

.chat-input{
  padding:15px;
  border-top:1px solid var(--border);
  display:flex;
  gap:9px;
}

.chat-input input{
  flex:1;
  background:#121215;
  border:1px solid var(--border);
  outline:none;
  color:white;
  padding:12px;
  border-radius:9px;
}

.send{
  width:45px;
  border:0;
  border-radius:9px;
  background:var(--purple);
  color:white;
  font-size:17px;
}

/* SETTINGS */
.settings{
  max-width:850px;
  margin:0 auto;
}

.settings-section{
  background:#0e0e10;
  border:1px solid var(--border);
  border-radius:13px;
  margin-bottom:15px;
  overflow:hidden;
}

.settings-title{
  padding:17px 18px;
  border-bottom:1px solid var(--border);
  font-size:14px;
  font-weight:700;
}

.setting{
  padding:15px 18px;
  display:flex;
  align-items:center;
  gap:15px;
  border-bottom:1px solid #19191c;
}

.setting:last-child{
  border-bottom:0;
}

.setting-info{
  flex:1;
}

.setting-info strong{
  display:block;
  font-size:13px;
}

.setting-info span{
  display:block;
  color:#72727b;
  font-size:11px;
  margin-top:4px;
}

.toggle{
  width:42px;
  height:23px;
  border-radius:20px;
  background:#29292e;
  position:relative;
  cursor:pointer;
}

.toggle::after{
  content:"";
  position:absolute;
  width:17px;
  height:17px;
  border-radius:50%;
  background:#777;
  top:3px;
  left:3px;
  transition:.2s;
}

.toggle.on{
  background:#7c3aed;
}

.toggle.on::after{
  left:22px;
  background:white;
}

/* PROFILE MODAL */
.modal{
  position:fixed;
  inset:0;
  background:#0009;
  display:none;
  align-items:center;
  justify-content:center;
  z-index:20;
  backdrop-filter:blur(5px);
}

.modal.show{
  display:flex;
}

.profile-modal{
  width:390px;
  background:#101012;
  border:1px solid #2a2a30;
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 20px 80px #000;
}

.profile-banner{
  height:100px;
  background:linear-gradient(135deg,#6d28d9,#9333ea,#4c1d95);
}

.profile-content{
  padding:0 20px 20px;
  position:relative;
}

.profile-content .avatar{
  width:76px;
  height:76px;
  border:5px solid #101012;
  margin-top:-38px;
  font-size:23px;
}

.profile-content h2{
  margin-top:10px;
  font-size:20px;
}

.profile-tag{
  color:#777781;
  font-size:12px;
  margin-top:3px;
}

.profile-about{
  background:#151518;
  border:1px solid var(--border);
  border-radius:9px;
  padding:12px;
  margin-top:16px;
  font-size:12px;
  color:#aaa;
  line-height:1.5;
}

.close{
  position:absolute;
  right:14px;
  top:14px;
  width:32px;
  height:32px;
  border:0;
  border-radius:50%;
  background:#0005;
  color:white;
  font-size:18px;
}

/* TOAST */
.toast{
  position:fixed;
  right:22px;
  bottom:22px;
  background:#17171a;
  border:1px solid #303038;
  padding:12px 15px;
  border-radius:10px;
  color:#ddd;
  font-size:13px;
  transform:translateY(100px);
  opacity:0;
  transition:.25s;
  z-index:50;
}

.toast.show{
  transform:translateY(0);
  opacity:1;
}

/* MOBILE */
.mobile-menu{
  display:none;
}

@media(max-width:800px){
  .sidebar{
    width:70px;
  }

  .logo{
    justify-content:center;
    padding:0;
  }

  .logo-name,
  .nav-title,
  .nav-item span,
  .user-info,
  .settings-btn{
    display:none;
  }

  .nav-item{
    justify-content:center;
    padding:0;
  }

  .bottom-user{
    padding:10px;
  }

  .user-card{
    justify-content:center;
    padding:7px;
  }

  .cards{
    grid-template-columns:1fr;
  }

  .big-card{
    grid-column:span 1;
  }

  .chat-list{
    width:75px;
  }

  .chat-user-info{
    display:none;
  }

  .chat-user{
    justify-content:center;
  }

  .chat-list .search{
    display:none;
  }
}

@media(max-width:520px){
  .sidebar{
    display:none;
  }

  .topbar{
    padding:0 15px;
  }

  .content{
    padding:18px;
  }

  .hero h1{
    font-size:29px;
  }

  .cards{
    display:block;
  }

  .card{
    margin-bottom:12px;
  }

  .chat-list{
    display:none;
  }

  .messages{
    padding:15px;
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar">

    <div class="logo">
      <div class="logo-icon">N</div>
      <div class="logo-name">Ne<span>xa</span></div>
    </div>

    <nav class="nav">

      <div class="nav-title">NEXA</div>

      <div class="nav-item active" data-page="home">
        <div class="nav-icon">🏠</div>
        <span>Home</span>
      </div>

      <div class="nav-item" data-page="friends">
        <div class="nav-icon">👥</div>
        <span>Friends</span>
      </div>

      <div class="nav-item" data-page="chat">
        <div class="nav-icon">💬</div>
        <span>Messages</span>
      </div>

      <div class="nav-item" data-page="explore">
        <div class="nav-icon">🔎</div>
        <span>Explore</span>
      </div>

      <div class="nav-title" style="margin-top:22px;">PERSONAL</div>

      <div class="nav-item" data-page="profile">
        <div class="nav-icon">👤</div>
        <span>My Profile</span>
      </div>

      </div>

    </nav>

    <div class="bottom-user">
      <div class="user-card">
        <div class="avatar">A</div>
        <div class="user-info">
          <div class="user-name">Ahmed</div>
          <div class="user-status">● Online</div>
        </div>
        <button class="settings-btn" onclick="openProfile()">⋯</button>
      </div>
    </div>

  </aside>

  <!-- MAIN -->
  <main class="main">

    <header class="topbar">
      <button class="top-button" onclick="showToast('Nexa is running locally ✨')">Nexa</button>
      <div class="page-title" id="pageTitle">Home</div>
      <div class="topbar-spacer"></div>
      <button class="top-button" onclick="openProfile()">👤 Profile</button>
    </header>

    <section class="content" id="content"></section>

  </main>

</div>

<!-- PROFILE MODAL -->
<div class="modal" id="profileModal" onclick="closeProfile(event)">
  <div class="profile-modal" onclick="event.stopPropagation()">

    <div class="profile-banner"></div>

    <div class="profile-content">
      <button class="close" onclick="closeProfile()">×</button>

      <div class="avatar">A</div>

      <h2>Ahmed</h2>
      <div class="profile-tag">@ahmed</div>

      <div class="profile-about">
        Welcome to my Nexa profile! 👋<br>
        Hanging out, chatting and having fun.
      </div>

      <button
        class="action primary"
        style="width:100%;margin-top:12px"
        onclick="showToast('Profile editing is available in this offline demo')"
      >
        ✏️ Edit Profile
      </button>
    </div>

  </div>

<div class="toast" id="toast"></div>

<script>
/* =========================
   OFFLINE NEXA
   ========================= */

const content = document.getElementById("content");
const pageTitle = document.getElementById("pageTitle");

const friends = [
  {
    name:"Alex",
    username:"@alex",
    letter:"A",
    online:true,
    status:"Playing games"
  },
  {
    name:"Sam",
    username:"@sam",
    letter:"S",
    online:true,
    status:"Hanging out"
  },
  {
    name:"Leo",
    username:"@leo",
    letter:"L",
    online:false,
    status:"Offline"
  },
  {
    name:"Max",
    username:"@max",
    letter:"M",
    online:false,
    status:"Offline"
  }
];

function renderHome(){

  content.innerHTML = `
    <div class="hero">
      <h1>Welcome back to <span>Nexa</span>.</h1>
      <p>Your place to chat, hang out and connect with friends.</p>
    </div>

    <div class="cards">

      <div class="card big-card">
        <div class="card-icon">👥</div>
        <h3>Your Friends</h3>
        <p>
          See your friends, check who's online and start a conversation.
        </p>

        <div class="friend-preview">
          <div class="mini-avatar">A</div>
          <div class="mini-avatar">S</div>
          <div class="mini-avatar">L</div>
          <div class="mini-avatar">M</div>
        </div>
      </div>

      <div class="card">
        <div class="card-icon">💬</div>
        <h3>Messages</h3>
        <p>
          Start a conversation with one of your friends.
        </p>

        <button class="action primary"
          style="margin-top:16px"
          onclick="navigate('chat')">
          Open Messages
        </button>
      </div>

      <div class="card">
        <div class="card-icon">🔎</div>
        <h3>Explore</h3>
        <p>
          Discover what Nexa has to offer.
        </p>

        <button class="action"
          style="margin-top:16px"
          onclick="navigate('explore')">
          Explore
        </button>
      </div>

      <div class="card">
        <div class="card-icon">✨</div>
        <h3>Made for you</h3>
        <p>
          Nexa is currently running completely offline. Everything you see
          here works without an account or internet connection.
        </p>
      </div>

    </div>
  `;
}

function renderFriends(){

  content.innerHTML = `
    <div class="page">

      <div class="page-header">
        <h1>Friends</h1>
        <p>Manage your friends and see who's around.</p>
      </div>

      <div class="tabs">
        <button class="tab active" onclick="friendTab(this,'all')">All</button>
        <button class="tab" onclick="friendTab(this,'online')">Online</button>
        <button class="tab" onclick="friendTab(this,'offline')">Offline</button>
        <button class="tab" onclick="friendTab(this,'pending')">Pending</button>
        <button class="tab" onclick="friendTab(this,'add')">Add a friend</button>
      </div>

      <div id="friendList" class="friend-list"></div>

    </div>
  `;

  renderFriendList("all");
}

function renderFriendList(type){

  const list = document.getElementById("friendList");

  if(type === "pending"){
    list.innerHTML = `
      <div class="card">
        <div class="card-icon">📨</div>
        <h3>No pending requests</h3>
        <p>You don't have any friend requests right now.</p>
      </div>
    `;
    return;
  }

  if(type === "add"){
    list.innerHTML = `
      <div class="card">
        <div class="card-icon">➕</div>
        <h3>Add a friend</h3>
        <p>Enter a username to send a friend request.</p>

        <div style="display:flex;gap:8px;margin-top:15px">
          <input
            class="search"
            id="addFriendInput"
            placeholder="Enter username..."
            style="margin:0"
          >

          <button class="action primary"
            onclick="addFriend()">
            Add
          </button>
        </div>
      </div>
    `;
    return;
  }

  let data = friends;

  if(type === "online"){
    data = friends.filter(f => f.online);
  }

  if(type === "offline"){
    data = friends.filter(f => !f.online);
  }

  list.innerHTML = data.map(friend => `
    <div class="friend">

      <div class="avatar">${friend.letter}</div>

      <div class="friend-details">
        <strong>${friend.name}</strong>
        <p>
          ${friend.online
            ? '<span class="online-dot"></span>Online'
            : 'Offline'}
          · ${friend.status}
        </p>
      </div>

      <div class="friend-actions">
        <button class="action"
          onclick="openChat('${friend.name}')">
          💬
        </button>

        <button class="action"
          onclick="showToast('Opened ${friend.name}\\'s profile')">
          👤
        </button>
      </div>

    </div>
  `).join("");
}

function sendMessage(){

  const input = document.getElementById("messageInput");
  const text = input.value.trim();

  if(!text) return;

  const messages = document.getElementById("messages");

  messages.innerHTML += `
    <div class="message me">

      <div class="avatar">A</div>

      <div class="message-body">
        <div class="message-name">Ahmed</div>
        <div class="message-text"></div>
      </div>

    </div>
  `;

  const last = messages.lastElementChild
    .querySelector(".message-text");

  last.textContent = text;

  input.value = "";
  messages.scrollTop = messages.scrollHeight;
}

function selectChat(name,element){

  document.querySelectorAll(".chat-user")
    .forEach(x=>x.classList.remove("active"));

  element.classList.add("active");

  document.getElementById("chatName").textContent = name;

  const friend = friends.find(f=>f.name === name);

  document.getElementById("chatStatus").textContent =
    friend && friend.online ? "Online" : "Offline";

  document.getElementById("messageInput").placeholder =
    "Message " + name + "...";
}

function openChat(name){

  navigate("chat");

  setTimeout(()=>{
    const users = document.querySelectorAll(".chat-user");

    users.forEach(user=>{
      if(user.textContent.includes(name)){
        selectChat(name,user);
      }
    });
  },50);
}

function filterChats(value){

  value = value.toLowerCase();

  document.querySelectorAll(".chat-user")
    .forEach(user=>{
      user.style.display =
        user.textContent.toLowerCase().includes(value)
        ? "flex"
        : "none";
    });
}

    chat:"Messages",

  if(page==="chat") renderChat();

function closeProfile(event){

      .classList.remove("show");
  }

let toastTimer;

function showToast(text){

  const toast = document.getElementById("toast");

  toast.textContent = text;
  toast.classList.add("show");

  clearTimeout(toastTimer);

  toastTimer = setTimeout(()=>{
    toast.classList.remove("show");
  },2500);
}
